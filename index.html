<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rich Text Editor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html-docx-js/0.3.1/html-docx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

:root{
    --bg:#f4f4f4;
    --panel:#ffffff;
    --toolbar:#fafafa;
    --border:#d0d0d0;
    --text:#222;
    --accent:#0066cc;
}

@media (prefers-color-scheme: dark){
    :root{
        --bg:#1e1e1e;
        --panel:#252526;
        --toolbar:#2d2d30;
        --border:#444;
        --text:#f0f0f0;
        --accent:#4da3ff;
    }
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI, Arial, sans-serif;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:10px;
    background:var(--toolbar);
    border-bottom:1px solid var(--border);
}

.toolbar button,
.toolbar select,
.toolbar input[type=color]{

    height:36px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--panel);
    color:var(--text);
    padding:0 10px;
    cursor:pointer;
}

.toolbar button:hover{
    background:#dbeaff;
}

.export-warning{
    padding:8px 12px;
    background:var(--toolbar);
    color:var(--text);
    border-bottom:1px solid var(--border);
    font-size:13px;
}

@media (prefers-color-scheme: dark){
    .export-warning{
        background:#4a3f00;
        color:#ffd966;
        border-bottom:1px solid #8f7a00;
    }
}

.spacer{
    flex:1;
}

.editor{
    flex:1;
    overflow:auto;
    padding:24px;
    background:var(--panel);
    outline:none;
    color:var(--text);
    line-height:1.5;
}

.editor:focus{
    box-shadow:inset 0 0 0 2px var(--accent);
}

.statusbar{
    padding:10px;
    background:var(--toolbar);
    border-top:1px solid var(--border);
    font-size:14px;
}

h1,h2,h3{
    margin-top:1em;
}

a{
    color:#0a66d6;
}

</style>
</head>
<body>

<div class="toolbar">

    <button onclick="exec('undo')">↶ Undo</button>
    <button onclick="exec('redo')">↷ Redo</button>

    <select onchange="setBlock(this.value)">
        <option value="">Paragraph</option>
        <option value="H1">Heading 1</option>
        <option value="H2">Heading 2</option>
        <option value="H3">Heading 3</option>
        <option value="P">Paragraph</option>
    </select>

    <button onclick="exec('bold')"><b>B</b></button>
    <button onclick="exec('italic')"><i>I</i></button>
    <button onclick="exec('underline')"><u>U</u></button>

    <button onclick="exec('insertUnorderedList')">• List</button>
    <button onclick="exec('insertOrderedList')">1. List</button>

    <button onclick="exec('justifyLeft')">⬅</button>
    <button onclick="exec('justifyCenter')">⬌</button>
    <button onclick="exec('justifyRight')">➡</button>

    <label>
        <input
            type="color"
            onchange="setColor(this.value)"
            title="Text Color">
    </label>

    <label>
        <input
            type="color"
            onchange="setHighlight(this.value)"
            title="Highlight Color">
    </label>

    <button onclick="insertLink()">🔗 Link</button>

    <div class="spacer"></div>

    <button onclick="openFile()">📂 Open</button>
    <button onclick="saveHtml()">💾 HTML</button>
    <button onclick="saveText()">📄 TXT</button>
    <button onclick="saveDocx()">📝 DOCX</button>
    <button onclick="savePdf()">📕 PDF</button>

</div>

<div class="export-warning">
⚠ Note: Images are currently only supported for HTML exports, other file types may not work correctly.
</div>

<div
    id="editor"
    class="editor"
    contenteditable="true">

<h1>Rich Text Editor</h1>

<p>
Start typing...
</p>

</div>

<div class="statusbar">
    <div id="stats">
        Words: 0 |
        Characters: 0 |
        Paragraphs: 0
    </div>
</div>

<input
    type="file"
    id="fileInput"
    accept=".html,.htm"
    hidden>

<script>

const editor = document.getElementById("editor");
const fileInput = document.getElementById("fileInput");

editor.addEventListener("keydown", function(e){

    if(e.key !== "Tab") return;

    e.preventDefault();

    const selection = window.getSelection();

    if(!selection.rangeCount) return;

    const range = selection.getRangeAt(0);

    const listItem =
        range.startContainer.parentElement?.closest("li");

    if(listItem){

        document.execCommand(
            e.shiftKey ? "outdent" : "indent",
            false,
            null
        );

        updateCounts();
        return;
    }

    const tabNode =
        document.createTextNode(
            "\u00A0\u00A0\u00A0\u00A0"
        );

    range.insertNode(tabNode);

    range.setStartAfter(tabNode);
    range.setEndAfter(tabNode);

    selection.removeAllRanges();
    selection.addRange(range);

    updateCounts();
});

function exec(command){
    document.execCommand(command,false,null);
    updateCounts();
}

function setBlock(tag){

    if(!tag) return;

    document.execCommand(
        "formatBlock",
        false,
        tag
    );

    updateCounts();
}

function setColor(color){
    document.execCommand(
        "foreColor",
        false,
        color
    );
}

function setHighlight(color){
    document.execCommand(
        "hiliteColor",
        false,
        color
    );
}

function insertLink(){

    const url = prompt(
        "Enter URL:"
    );

    if(!url) return;

    document.execCommand(
        "createLink",
        false,
        url
    );
}

function updateCounts(){

    const rawText =
        editor.innerText || "";

    const normalized =
        rawText
            .replace(/\u00A0/g," ")
            .replace(/\s+/g," ")
            .trim();

    const words =
        normalized.length
        ? normalized.split(" ").length
        : 0;

    const characters =
        rawText.length;

    const paragraphs =
        Math.max(
            editor.querySelectorAll(
                "p,h1,h2,h3,h4,h5,h6,li,div"
            ).length,
            normalized ? 1 : 0
        );

    document.getElementById(
        "stats"
    ).textContent =
    `Words: ${words} | Characters: ${characters} | Paragraphs: ${paragraphs}`;
}

editor.addEventListener(
    "input",
    updateCounts
);

editor.addEventListener(
    "keyup",
    updateCounts
);

editor.addEventListener(
    "paste",
    () => setTimeout(updateCounts,20)
);

function saveHtml(){

    const html =
`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Document</title>
</head>
<body>
${editor.innerHTML}
</body>
</html>`;

    downloadBlob(
        new Blob(
            [html],
            {type:"text/html"}
        ),
        "document.html"
    );
}

function saveText(){

    downloadBlob(
        new Blob(
            [editor.innerText],
            {type:"text/plain"}
        ),
        "document.txt"
    );
}

function saveDocx(){

    const html =
`<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>

body{
    font-family: Calibri, Arial, sans-serif;
    font-size: 11pt;
    line-height: 1.4;
}

h1{
    font-size: 24pt;
    margin: 12pt 0;
}

h2{
    font-size: 18pt;
    margin: 10pt 0;
}

h3{
    font-size: 14pt;
    margin: 8pt 0;
}

p{
    margin: 6pt 0;
}

img{
    max-width: 100%;
    height: auto;
}

table{
    border-collapse: collapse;
}

td, th{
    border: 1px solid #000;
    padding: 4pt;
}

</style>

</head>

<body>
${editor.innerHTML}

</body>
</html>`;

    const converted =
        htmlDocx.asBlob(html);

    downloadBlob(
        converted,
        "document.docx"
    );
}

async function savePdf() {

    const exportRoot = document.createElement("div");

    exportRoot.style.background = "#ffffff";
    exportRoot.style.color = "#000000";
    exportRoot.style.padding = "20px";
    exportRoot.style.width = "800px";
    exportRoot.style.position = "absolute";
    exportRoot.style.left = "-99999px";
    exportRoot.style.top = "0";

    const clone = editor.cloneNode(true);

    exportRoot.appendChild(clone);

    document.body.appendChild(exportRoot);

    try {

        const svgElements = clone.querySelectorAll("svg");

        for (const svg of svgElements) {

            try {

                const serializer =
                    new XMLSerializer();

                let svgSource =
                    serializer.serializeToString(svg);

                if (!svgSource.includes("xmlns=")) {

                    svgSource =
                        svgSource.replace(
                            "<svg",
                            '<svg xmlns="http://www.w3.org/2000/svg"'
                        );
                }

                const svgBlob =
                    new Blob(
                        [svgSource],
                        {
                            type: "image/svg+xml"
                        }
                    );

                const svgUrl =
                    URL.createObjectURL(svgBlob);

                const image =
                    new Image();

                await new Promise(
                    (resolve, reject) => {

                        image.onload = resolve;
                        image.onerror = reject;

                        image.src = svgUrl;
                    }
                );

                const canvas =
                    document.createElement("canvas");

                canvas.width =
                    image.naturalWidth ||
                    image.width ||
                    1000;

                canvas.height =
                    image.naturalHeight ||
                    image.height ||
                    1000;

                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    image,
                    0,
                    0
                );

                const png =
                    canvas.toDataURL(
                        "image/png"
                    );

                const replacement =
                    document.createElement("img");

                replacement.src = png;
                replacement.style.maxWidth = "100%";
                replacement.style.height = "auto";

                svg.replaceWith(
                    replacement
                );

                URL.revokeObjectURL(
                    svgUrl
                );

            } catch (err) {

                console.warn(
                    "SVG conversion failed",
                    err
                );
            }
        }

        const images =
            clone.querySelectorAll("img");

        await Promise.all(

            Array.from(images).map(

                img => {

                    if (
                        img.complete &&
                        img.naturalWidth > 0
                    ) {
                        return Promise.resolve();
                    }

                    return new Promise(
                        resolve => {

                            const done =
                                () => {

                                    img.removeEventListener(
                                        "load",
                                        done
                                    );

                                    img.removeEventListener(
                                        "error",
                                        done
                                    );

                                    resolve();
                                };

                            img.addEventListener(
                                "load",
                                done
                            );

                            img.addEventListener(
                                "error",
                                done
                            );
                        }
                    );
                }
            )
        );

        await new Promise(
            resolve =>
                requestAnimationFrame(
                    () =>
                        requestAnimationFrame(
                            resolve
                        )
                )
        );

        await html2pdf()

            .set({

                margin: 0.5,

                filename:
                    "document.pdf",

                image: {

                    type: "jpeg",

                    quality: 1.0
                },

                html2canvas: {

                    scale: 3,

                    useCORS: true,

                    allowTaint: true,

                    backgroundColor:
                        "#ffffff",

                    logging: false,

                    imageTimeout:
                        30000
                },

                pagebreak: {

                    mode: [
                        "css",
                        "legacy"
                    ]
                },

                jsPDF: {

                    unit: "in",

                    format: "letter",

                    orientation:
                        "portrait",

                    compress:
                        false
                }

            })

            .from(exportRoot)

            .save();

    }
    finally {

        document.body.removeChild(
            exportRoot
        );
    }
}

function downloadBlob(
    blob,
    filename
){

    const a =
        document.createElement("a");

    a.href =
        URL.createObjectURL(blob);

    a.download =
        filename;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    setTimeout(
        () => URL.revokeObjectURL(a.href),
        100
    );
}

function openFile(){
    fileInput.click();
}

fileInput.addEventListener(
    "change",
    loadFile
);

function loadFile(event){

    const file =
        event.target.files[0];

    if(!file) return;

    const reader =
        new FileReader();

    reader.onload =
        function(e){

            const parser =
                new DOMParser();

            const doc =
                parser.parseFromString(
                    e.target.result,
                    "text/html"
                );

            editor.innerHTML =
                doc.body.innerHTML;

            updateCounts();
        };

    reader.readAsText(file);
}

updateCounts();

</script>

</body>
</html>
